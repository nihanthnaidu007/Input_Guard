name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The quality gate: lint, tests with a 90% branch-coverage floor, and
  # strict typing across the full supported Python matrix (spec §8).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check inputguard tests eval
      - name: Tests with 90% branch-coverage floor
        run: pytest -q --cov=inputguard --cov-branch --cov-fail-under=90 --strict
      - name: Strict typing (checks the shipped py.typed)
        run: mypy --strict inputguard

  # Latency budgets are gates, not notes: a regression here is a production
  # failure mode (the v0.2 unbounded 3.8 s scan). Measured p50/p99 print to
  # the job log; budgets and their derivation live in tests/test_benchmarks.py.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Latency budgets (p50/p99 recorded)
        run: pytest -v -s tests/test_benchmarks.py

  # The zero-dependency promise, verified against the built artifact — not
  # the source tree: wheel METADATA carries no Requires-Dist, a bare venv
  # install pulls no third-party package, and the public API + CLI work from
  # the installed wheel alone. The smoke steps run from a scratch directory
  # so the repo's local `inputguard/` package can never shadow the wheel.
  wheel-zero-dep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Wheel metadata declares no runtime dependencies
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          meta = zipfile.ZipFile(wheel).read(meta_name).decode()
          assert "Requires-Dist:" not in meta, (
              "wheel METADATA declares runtime dependencies — the zero-dep "
              "promise is broken"
          )
          print(f"{wheel}: no Requires-Dist entries — zero runtime dependencies")
          PY
      - name: Install wheel into a bare venv
        run: |
          python -m venv bare
          ./bare/bin/pip install --upgrade pip
          ./bare/bin/pip install dist/*.whl
      - name: Public API works from the installed wheel
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/bare/bin/python" - <<'PY'
          import json

          import inputguard

          assert inputguard.__version__
          guard = inputguard.InputGuard()
          result = guard.analyze("make this faster", domain="coding")
          assert isinstance(result.clarity_score, int)
          assert 0 <= result.clarity_score <= 100
          payload = result.to_dict()
          json.dumps(payload)
          print(f"bare-venv analyze OK: {result.status} score={result.clarity_score}")
          PY
      - name: Bare venv contains no third-party packages
        run: |
          third_party=$(./bare/bin/pip list --format=freeze \
            | cut -d= -f1 | tr '[:upper:]' '[:lower:]' \
            | grep -v -E '^(inputguard|pip|setuptools)$' || true)
          if [ -n "$third_party" ]; then
            echo "Third-party packages present after wheel install: $third_party"
            exit 1
          fi
          echo "bare venv holds only inputguard (+ venv tooling)"
      - name: CLI works from the installed wheel
        run: |
          cd "$(mktemp -d)"
          INPUTGUARD="$GITHUB_WORKSPACE/bare/bin/inputguard"
          "$INPUTGUARD" analyze "make this faster" --format json
          set +e
          "$INPUTGUARD" analyze "make this faster" --min-score 85
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 below the min-score floor, got $code"
            exit 1
          fi
          echo "CLI exit codes OK (0 on analysis, 1 below the min-score floor)"
