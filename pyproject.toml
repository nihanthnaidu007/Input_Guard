[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inputguard"
version = "0.3.0"
description = "Catch unclear inputs before they become bad AI outputs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = [
  "llm", "ai", "input-validation", "clarity",
  "agents", "rag", "input-guard", "prompt-quality"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.8",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "twine>=5",
]

[project.scripts]
inputguard = "inputguard.cli:main"

[tool.setuptools.packages.find]
include = ["inputguard*"]

[tool.setuptools.package-data]
inputguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501: the codebase's prose-bearing table lines are exempt; the CI run
# treats ruff as the gate with this exact policy.
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["inputguard"]
# No python_version pin: modern mypy rejects 3.9 as a target, and the CI
# matrix already type-checks under each supported interpreter.
